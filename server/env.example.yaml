# Copy this file to ~/env.yaml in Google Cloud Shell (NOT into the code folder) and fill it in:
#   cp env.example.yaml ~/env.yaml && nano ~/env.yaml
# Never upload the filled-in file to GitHub.

NODE_ENV: "production"
PGSSL: "off"                      # Cloud SQL is reached through Google's private socket, no SSL needed
# Replace DBPASSWORD (letters and numbers only) and PROJECT_ID:
DATABASE_URL: "postgres://postgres:DBPASSWORD@/rosier_app?host=/cloudsql/PROJECT_ID:asia-south1:rosier-db"
JWT_SECRET: "PASTE-A-LONG-RANDOM-STRING"   # run: openssl rand -hex 32   (moving from Render? use Render's value)
ADMIN_EMAIL: "you@rosierfoods.com"         # first admin login (change the password later in the panel)
ADMIN_PASSWORD: "A-STRONG-PASSWORD"
STORE_URL: "https://www.rosierfoods.com"
JUDGEME_SHOP: "yourstore.myshopify.com"
# PUBLIC_URL is optional on Cloud Run (the server works out its own address).
# Set it only if you add your own domain, e.g. "https://api.rosierfoods.com".
