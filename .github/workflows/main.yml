name: Build Android APK

# Runs only when you press "Run workflow" (Actions tab), so uploading code doesn't start a build.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # Push notifications: paste the whole google-services.json (Firebase) into a
      # repository secret called GOOGLE_SERVICES_JSON. Without it the app builds, just without push.
      - name: Add Firebase config (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "google-services.json added"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — push notifications will be off in this build."
          fi

      - name: Create Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          NODE_ENV: production

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rosier-app-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
